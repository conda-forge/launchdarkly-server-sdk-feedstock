{% set name = "launchdarkly-server-sdk" %}
{% set version = "9.19.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
  sha256: c8a2236c5bdbf3ee29138ae4fce488a7a6b1b9de878dd4b7aa7c72a65e7785dc

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - hatchling
    - python {{ python_min }}
  run:
    - launchdarkly-eventsource >=1.7.2,<2.0.0
    - certifi >=2026.10.19
    - expiringdict >=1.1.4
    - pyrfc3339 >=1.0
    - python >={{ python_min }}
    - semver >=2.10.2
    - urllib3 >=1.26.0,<3

test:
  imports:
    - ldclient
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/launchdarkly/python-server-sdk
  summary: LaunchDarkly SDK for Python
  license: Apache-2.0
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - xhochy
